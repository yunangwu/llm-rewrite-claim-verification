# Per-model vllm parameters, keyed by HF model ID.
# Referenced by submit_infer.sh / submit_rewrite.sh to set DP and TP
# when launching `vllm serve`.
#
# concurrency: client-side items processed in parallel (each fires consistency_n=10 requests).
#   Total in-flight requests = concurrency × consistency_n
#   H200 (141 GB HBM3e) can absorb far more than the old default of 8.
#
# DP / TP cheat sheet for 8× H200 (141 GB each):
#   2B  bf16 ~4 GB/replica  → DP=8 TP=1  (8 replicas, ~4 GB each)
#   8B  bf16 ~16 GB/replica → DP=8 TP=1  (8 replicas, ~16 GB each)
#   72B bf16 ~144 GB        → DP=4 TP=2  (4 replicas, 2 GPUs × ~72 GB each)

# ---------------------------------------------------------------------------
# Inference models (VL, used by: infer)
# ---------------------------------------------------------------------------

Qwen/Qwen3-VL-2B-Instruct:
  data_parallel_size: 8
  tensor_parallel_size: 1
  dtype: bfloat16
  max_model_len: 8192
  gpu_memory_utilization: 0.9
  trust_remote_code: true
  concurrency: 64              # 128 causes queue backup → timeouts; 64 is safer

Qwen/Qwen3-VL-4B-Instruct:
  data_parallel_size: 8
  tensor_parallel_size: 1
  dtype: bfloat16
  max_model_len: 16384
  gpu_memory_utilization: 0.9
  trust_remote_code: true
  concurrency: 80               # ~8 GB bf16/replica

Qwen/Qwen3-VL-8B-Instruct:
  data_parallel_size: 8
  tensor_parallel_size: 1
  dtype: bfloat16
  max_model_len: 8192
  gpu_memory_utilization: 0.9
  trust_remote_code: true
  concurrency: 64              # ~16 GB/replica → plenty of headroom

Qwen/Qwen3-VL-32B-Instruct:    # largest dense Qwen3-VL (no 72B exists in this series)
  data_parallel_size: 8        # ~64 GB bf16/replica → fits comfortably per H200
  tensor_parallel_size: 1
  dtype: bfloat16
  max_model_len: 8192
  gpu_memory_utilization: 0.9
  trust_remote_code: true
  concurrency: 32

