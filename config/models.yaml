Qwen/Qwen2.5-VL-7B-Instruct:   # 7B; ~14 GB bf16/replica
  data_parallel_size: 8
  tensor_parallel_size: 1
  dtype: bfloat16
  max_model_len: 8192
  gpu_memory_utilization: 0.9
  trust_remote_code: true
  concurrency: 64

Qwen/Qwen2.5-VL-72B-Instruct:  # 72B; ~144 GB bf16 → TP=2 DP=4
  data_parallel_size: 4
