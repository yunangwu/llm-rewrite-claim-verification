[project]
name = "hedge-booster"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "openai>=1.0",
    "pyyaml>=6.0",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "tqdm>=4.65",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core"]
